  parameters:
    bpm:
      name: bpm
      in: query
      description: "Return tracks with a specified bpm[from], bpm[to]"
      required: false
      style: deepObject
      explode: false
      schema:
        type: object
        properties:
          from:
            type: integer
            description: Return tracks with at least this bpm value
            example: 123
          to:
            type: integer
            description: Return tracks with at most this bpm value
            example: 456
    created_at:
      name: created_at
      in: query
      description: (yyyy-mm-dd hh:mm:ss) return tracks created within the specified
        dates
      required: false
      style: deepObject
      explode: false
      schema:
        type: object
        properties:
          from:
            type: string
            description: (yyyy-mm-dd hh:mm:ss) return tracks created at this date
              or later
            example: 2020-12-24 00:00:00
          to:
            type: string
            description: (yyyy-mm-dd hh:mm:ss) return tracks created at this date
              or earlier
            example: 2020-12-26 00:00:00
    duration:
      name: duration
      in: query
      description: Return tracks within a specified duration range
      required: false
      style: deepObject
      explode: false
      schema:
        type: object
        properties:
          from:
            type: integer
            description: Return tracks with at least this duration value
            example: 123456
          to:
            type: integer
            description: Return tracks with at most this duration value
            example: 456789
    genres:
      name: genres
      in: query
      description: A comma separated list of genres
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "Pop,House"
    urns:
      name: urns
      in: query
      description: A comma separated list of track urns to filter on
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "soundcloud:tracks:1,soundcloud:tracks:2,soundcloud:tracks:3"
    limit:
      name: limit
      in: query
      description: Number of results to return in the collection.
      required: false
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
        default: 50
      example: 2
    offset:
      name: offset
      in: query
      description: "Offset of first result. Deprecated, use `linked_partitioning`\
        \ instead."
      required: false
      deprecated: true
      style: form
      explode: true
      schema:
        type: integer
        default: 0
      example: 0
    q:
      name: q
      in: query
      description: search
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: hello
    tags:
      name: tags
      in: query
      description: A comma separated list of tags
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: test
    url:
      name: url
      in: query
      description: |
        SoundCloud URL to resolve. Supports track, playlist, user, and system playlist permalinks (e.g. `https://soundcloud.com/discover/sets/track-stations:2287580618`).
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: https://soundcloud.com/user-434241656
    linked_partitioning:
      name: linked_partitioning
      in: query
      description: "Returns paginated collection of items (recommended, returning\
        \ a list without pagination is deprecated and should not be used)"
      required: false
      style: form
      explode: true
      schema:
        type: boolean
      example: true
    sort:
      name: sort
      in: query
      description: Sort order of tracks by upload date. `desc` returns newest tracks
        first; `asc` returns oldest first. Also accepts `direction` or `order` as
        aliases.
      required: false
      style: form
      explode: true
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
      example: desc
    secret_token:
      name: secret_token
      in: query
      description: A secret token to fetch private playlists/tracks
      required: false
      style: form
      explode: true
      schema:
        type: string
    access:
      name: access
      in: query
      description: |
        Filters content by level of access the user (logged in or anonymous) has to the track. The result list will include only tracks with the specified access. Include all options if you'd like to see all possible tracks. See `Track#access` schema for more details.
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - playable
          - preview
          - blocked
    access_explicit:
      name: access
      in: query
      description: |
        Filters content by level of access the user (logged in or anonymous) has to the track. The result list will include only tracks with the specified access. Include all options if you'd like to see all possible tracks. See `Track#access` schema for more details.
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - playable
          - preview
          - blocked
    show_tracks:
      name: show_tracks
      in: query
      description: A boolean flag to request a playlist with or without tracks. Default
        is `true`.
      required: false
      style: form
      explode: true
      schema:
        type: boolean
      example: true
    system_playlist_id:
      name: id
      in: path
      description: |
        System playlist URN or identifier. Accepts a full URN (e.g. `soundcloud:system-playlists:track-stations:2287580618`) or the identifier portion (e.g. `track-stations:2287580618`).
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: soundcloud:system-playlists:track-stations:2287580618
    playlist_urn:
      name: playlist_urn
      in: path
      description: |
        User playlist URN or system playlist (station) URN.

        Examples:
        - User playlist: `soundcloud:playlists:1212781357`
        - System playlist (station): `soundcloud:system-playlists:track-stations:2287580618`
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: soundcloud:playlists:1212781357
    fake_playlist_urn:
      name: playlist_urn
      in: path
      description: SoundCloud playlist id
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: soundcloud:playlists:10
    repost_playlist_urn:
      name: playlist_urn
      in: path
      description: SoundCloud playlist id
      required: true
      style: simple
      explode: false
      schema:
        type: string
