          type: integer
          description: upload seconds left.
          nullable: true
      description: user's upload quota
    Comments:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        next_href:
          type: string
          nullable: true
    TrackMetadataRequest:
      type: object
      properties:
