          type: string
          description: Created timestamp.
        urn:
          type: string
          description: Identifier.
        kind:
          type: string
          description: Kind (comment).
        user_urn:
          type: string
          description: User's identifier.
        timestamp:
          type: string
          description: Timestamp.
        track_urn:
          type: string
          description: Track's identifier.
        uri:
          type: string
          description: Comment's URL.
        user:
          $ref: "#/components/schemas/CommentUser"
      description: User's Comment
    CommentUser:
      type: object
      properties:
        urn:
          type: string
          description: unique identifier
        kind:
          type: string
          description: kind of resource.
        permalink:
          type: string
          description: permalink of the resource.
        username:
          type: string
          description: username
        last_modified:
          type: string
          description: last modified timestamp.
        uri:
          type: string
          description: API resource URL.
        permalink_url:
          type: string
          description: URL to the SoundCloud.com page.
        avatar_url:
          type: string
          description: URL to a JPEG image.
        followers_count:
          type: integer
          description: number of followers.
        followings_count:
          type: integer
          description: number of followed users.
        reposts_count:
          type: integer
          description: number of reposts from user
      description: SoundCloud User object
    Tracks:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        next_href:
          type: string
    MeQuota:
      type: object
