openapi: 3.0.4
info:
  title: SoundCloud Public API Specification
  description: "Provides access to SoundCloud users, tracks, playlists, comments,\
    \ likes, reposts and followings, so applications can browse, upload and manage\
    \ audio content on behalf of authenticated users."
  termsOfService: https://developers.soundcloud.com/docs/api/terms-of-use
  contact:
    name: API issue tracker
    url: https://github.com/soundcloud/api
  version: 1.0.0
servers:
- url: https://api.soundcloud.com
security:
- AuthHeader: []
- oAuth2_1: []
tags:
- name: oauth
  description: Authentication and Authorization Endpoints.
- name: me
  description: Own User Endpoints. Requires an access token obtained via the authorization_code
    flow (resource owner required).
- name: search
  description: Search Endpoints. Supports access tokens from both authorization_code
    and client_credentials flows.
- name: playlists
  description: Playlists Endpoints.
- name: system-playlists
  description: "System Playlists Endpoints (e.g. track stations, artist stations)."
- name: tracks
  description: Tracks Endpoints.
- name: users
  description: SoundCloud Users Endpoints.
- name: likes
  description: "Liking Tracks, Playlists & System Playlists (stations)."
- name: reposts
  description: Reposting Tracks & Playlists.
- name: miscellaneous
  description: Miscellaneous Endpoints.
paths:
  /me:
    get:
      tags:
      - me
      summary: Returns the authenticated user’s information.
      responses:
        "200":
          $ref: "#/components/responses/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/feed:
    get:
      tags:
      - me
      summary: Returns the authenticated user's feed.
      parameters:
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Activities"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/feed/tracks:
    get:
      tags:
      - me
      summary: Returns the authenticated user's recent track related feed.
      parameters:
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Activities"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/recently-played/tracks:
    get:
      tags:
      - me
      summary: Returns the authenticated user's last 25 recently played tracks.
      description: "Returns up to 25 full track objects in reverse chronological order.\
        \ Duplicate tracks are omitted, keeping only the most recent play. Tracks\
        \ that are not visible to the caller are omitted. This endpoint does not support\
        \ pagination or a `limit` query parameter."
      parameters:
      - $ref: "#/components/parameters/access_explicit"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/likes/tracks:
    get:
      tags:
      - me
      summary: Returns a list of favorited or liked tracks of the authenticated user.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/access_explicit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/likes/playlists:
    get:
      tags:
      - me
      summary: Returns a list of favorited or liked playlists of the authenticated
        user.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/likes/system-playlists:
    get:
      tags:
      - me
      summary: Returns a list of liked system playlists (stations) of the authenticated
        user.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/SystemPlaylists"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/followings:
    get:
      tags:
      - me
      summary: Returns a list of users who are followed by the authenticated user.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/followings/tracks:
    get:
      tags:
      - me
      summary: Returns a list of recent tracks from users followed by the authenticated
        user.
      parameters:
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/TracksList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/followings/{user_urn}:
    put:
      tags:
      - me
      summary: Follows a user.
      description: "Fails with 422 when the user cannot be followed, for example when\
        \ the authenticated user has reached the maximum number of followings. The\
        \ response `message` states the reason."
      parameters:
      - $ref: "#/components/parameters/user_urn_to_follow"
      responses:
        "200":
          $ref: "#/components/responses/Successful"
        "201":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags:
      - me
      summary: Deletes a user who is followed by the authenticated user.
      parameters:
      - $ref: "#/components/parameters/user_urn_to_follow"
      responses:
        "200":
          description: The user was unfollowed.
          content:
            application/json; charset=utf-8:
              examples:
                "200":
                  $ref: "#/components/examples/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /me/followers:
    get:
      tags:
      - me
      summary: Returns a list of users who are following the authenticated user.
      parameters:
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/playlists:
    get:
      tags:
      - me
      summary: Returns user’s playlists (sets).
      description: "Returns playlist info, playlist tracks and tracks owner info."
      parameters:
      - $ref: "#/components/parameters/show_tracks"
      - $ref: "#/components/parameters/linked_partitioning"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/tracks:
    get:
      tags:
      - me
      summary: Returns a list of the authenticated user's tracks.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/sort"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/reposts/tracks:
    get:
      tags:
      - me
      - reposts
      summary: Returns a list of track reposts of the authenticated user.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/access_explicit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/reposts/playlists:
    get:
      tags:
      - me
      - reposts
      summary: Returns a list of playlist reposts of the authenticated user.
      parameters:
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tracks:
    get:
      tags:
      - search
      summary: Performs a track search based on a query
      parameters:
      - $ref: "#/components/parameters/q"
      - $ref: "#/components/parameters/urns"
      - $ref: "#/components/parameters/genres"
      - $ref: "#/components/parameters/tags"
      - $ref: "#/components/parameters/bpm"
      - $ref: "#/components/parameters/duration"
      - $ref: "#/components/parameters/created_at"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Internal Server Error
    post:
      tags:
      - tracks
      summary: Uploads a new track.
      requestBody:
        description: Track metadata and the audio file to upload.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TracksBody"
            examples:
              default:
                $ref: "#/components/examples/TrackDataRequest"
          multipart/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TracksBody1"
      responses:
        "201":
          $ref: "#/components/responses/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /playlists:
    get:
      tags:
      - search
      summary: Performs a playlist search based on a query
      parameters:
      - $ref: "#/components/parameters/q"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/show_tracks"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
      - playlists
      summary: Creates a playlist.
      requestBody:
        description: Create Playlist request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpdatePlaylistRequest"
            examples:
              default:
                $ref: "#/components/examples/CreateUpdatePlaylistRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlaylistsBody"
            examples:
              default:
                $ref: "#/components/examples/CreateUpdatePlaylistFormRequest"
      responses:
        "201":
          $ref: "#/components/responses/Playlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users:
    get:
      tags:
      - search
      summary: Performs a user search based on a query
      parameters:
      - $ref: "#/components/parameters/q"
      - $ref: "#/components/parameters/urns"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /playlists/{playlist_urn}:
    get:
      tags:
      - playlists
      summary: Returns a playlist.
      parameters:
      - $ref: "#/components/parameters/playlist_urn"
      - $ref: "#/components/parameters/secret_token"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/show_tracks"
      responses:
        "200":
          $ref: "#/components/responses/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
      - playlists
      summary: Updates a playlist.
      parameters:
      - $ref: "#/components/parameters/fake_playlist_urn"
      requestBody:
        description: Playlist payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpdatePlaylistRequest"
            examples:
              default:
                $ref: "#/components/examples/CreateUpdatePlaylistRequest"
      responses:
        "200":
          $ref: "#/components/responses/Playlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
      - playlists
      summary: Deletes a playlist.
      parameters:
      - $ref: "#/components/parameters/fake_playlist_urn"
      responses:
        "200":
          description: Success
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{playlist_urn}/tracks:
    get:
      tags:
      - playlists
      summary: Returns tracks under a playlist.
      parameters:
      - $ref: "#/components/parameters/playlist_urn"
      - $ref: "#/components/parameters/secret_token"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /playlists/{playlist_urn}/reposters:
    get:
      tags:
      - playlists
      summary: Returns a collection of playlist's reposters.
      parameters:
      - $ref: "#/components/parameters/playlist_urn"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}:
    get:
      tags:
      - tracks
      summary: Returns a track.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/secret_token"
      responses:
        "200":
          $ref: "#/components/responses/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
      - tracks
      summary: Updates a track's information.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      requestBody:
        description: Track payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackMetadataRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TrackUpdateFormRequest"
          multipart/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TrackUpdateFormRequest"
      responses:
        "200":
          $ref: "#/components/responses/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
      - tracks
      summary: Deletes a track.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      responses:
        "200":
          description: Success
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}/storefront:
    put:
      tags:
      - tracks
      summary: Creates or updates the storefront (Artist Storefront) of a track.
      description: |
        Creates or updates the storefront module shown on the track page. The request replaces
        the whole storefront: optional fields (link_title, description, price) are cleared when
        omitted, so always send every value the storefront should keep. The request fails with
        403 when the authenticated user does not own the track, and also when the user does not
        hold a creator subscription that includes external purchase options. The storefront
        links to an external page — no payment is processed by SoundCloud.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      requestBody:
        description: Storefront payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontUpdateRequest"
      responses:
        "200":
          description: Success
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/Storefront"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}/preview:
    get:
      tags:
      - tracks
      summary: Starts playback of a preview of the track
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/secret_token"
      responses:
        "302":
          $ref: "#/components/responses/Found"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}/streams:
    get:
      tags:
      - tracks
      summary: Returns a track's streamable URLs (needs to keep using authentication)
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/secret_token"
      responses:
        "200":
          $ref: "#/components/responses/Streams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}/comments:
    get:
      tags:
      - tracks
      summary: Returns the comments posted on the track(track_urn).
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Comments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
      - tracks
      summary: Creates a comment on a track.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      requestBody:
        description: |
          Body of a comment
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackUrnCommentsBody"
        required: true
      responses:
        "201":
          $ref: "#/components/responses/Comment"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /tracks/{track_urn}/favoriters:
    get:
      tags:
      - tracks
      summary: Returns a list of users who have favorited or liked the track.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}/reposters:
    get:
      tags:
      - tracks
      summary: Returns a collection of track's reposters.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{track_urn}/related:
    get:
      tags:
      - tracks
      summary: Returns all related tracks of track on SoundCloud.
      parameters:
      - $ref: "#/components/parameters/track_urn"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /system-playlists/{id}:
    get:
      tags:
      - system-playlists
      summary: Returns a system playlist.
      parameters:
      - $ref: "#/components/parameters/system_playlist_id"
      - $ref: "#/components/parameters/access"
      responses:
        "200":
          $ref: "#/components/responses/SystemPlaylist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /resolve:
    get:
      tags:
      - miscellaneous
      summary: Resolves soundcloud.com and on.soundcloud.com URLs to Resource URLs
        to use with the API.
      parameters:
      - $ref: "#/components/parameters/url"
      responses:
        "302":
          $ref: "#/components/responses/Found"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}:
    get:
      tags:
      - users
      summary: Returns a user.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}/related:
    get:
      tags:
      - users
      summary: Returns related artist recommendations for a user on SoundCloud.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}/followers:
    get:
      tags:
      - users
      summary: Returns a list of user’s followers.
      description: Returns a list of users that follows (user_urn).
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_urn}/followings:
    get:
      tags:
      - users
      summary: Returns a list of user’s followings.
      description: Returns list of users that (user_urn) follows.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/Users"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_urn}/playlists:
    get:
      tags:
      - users
      summary: Returns a list of user's playlists.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/show_tracks"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_urn}/tracks:
    get:
      tags:
      - users
      summary: Returns a list of a given user's tracks.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/sort"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_urn}/web-profiles:
    get:
      tags:
      - users
      summary: "Returns list of user's links added to their profile (website, facebook,\
        \ instagram)."
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/WebProfiles"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_urn}/likes/tracks:
    get:
      tags:
      - users
      summary: Returns a list of user's liked tracks.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}/likes/playlists:
    get:
      tags:
      - users
      summary: Returns a list of user's liked playlists.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}/likes/system-playlists:
    get:
      tags:
      - users
      summary: Returns a list of user's liked system playlists (stations).
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/SystemPlaylists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}/reposts/tracks:
    get:
      tags:
      - users
      - reposts
      summary: Returns a list of user's track reposts.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/access"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Tracks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_urn}/reposts/playlists:
    get:
      tags:
      - users
      - reposts
      summary: Returns a list of user's playlist reposts.
      parameters:
      - $ref: "#/components/parameters/user_urn"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/linked_partitioning"
      responses:
        "200":
          $ref: "#/components/responses/Playlists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /likes/tracks/{track_urn}:
    post:
      tags:
      - likes
      summary: Likes a track.
      parameters:
      - $ref: "#/components/parameters/test_track_urn"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
      - likes
      summary: Unlikes a track.
      parameters:
      - $ref: "#/components/parameters/test_track_urn"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /likes/playlists/{playlist_urn}:
    post:
      tags:
      - likes
      summary: Likes a playlist or system playlist (station).
      parameters:
      - $ref: "#/components/parameters/playlist_urn"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
      - likes
      summary: Unlikes a playlist or system playlist (station).
      parameters:
      - $ref: "#/components/parameters/playlist_urn"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /reposts/tracks/{track_urn}:
    post:
      tags:
      - reposts
      summary: Reposts a track as the authenticated user
      parameters:
      - $ref: "#/components/parameters/test_track_urn"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /reposts/playlists/{playlist_urn}:
    post:
      tags:
      - reposts
      summary: Reposts a playlist as the authenticated user
      parameters:
      - $ref: "#/components/parameters/repost_playlist_urn"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
      - reposts
      summary: Removes a repost on a playlist as the authenticated user
      parameters:
      - $ref: "#/components/parameters/repost_playlist_urn"
      responses:
        "200":
          description: Success
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /disconnect:
    post:
      tags:
      - oauth
      summary: Revokes OAuth access for the calling application.
      description: |
        Invalidates access tokens for the client application that issued the current access token.
        Returns 400 if disconnect is not supported for the current token.
      responses:
        "204":
          description: Tokens invalidated successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Internal Server Error
  /sign-out:
    post:
      summary: Invalidates the session associated with the current token.
      responses:
        "200":
          description: Success
components:
  schemas:
    PlaylistsResult:
      description: "Playlists returned either as a paginated collection or as a plain\
        \ list, depending on the linked_partitioning query parameter."
      oneOf:
      - $ref: "#/components/schemas/Playlists"
      - $ref: "#/components/schemas/PlaylistsArray"
    TrackstrackUrncommentsComment:
      required:
      - body
      type: object
      properties:
        body:
          type: string
          description: Comment's content
          example: test comment
        timestamp:
          description: Timestamp of a comment. String or float representation is supported
          oneOf:
          - type: string
          - type: number
    User:
      type: object
      properties:
        avatar_url:
          type: string
          description: URL to a JPEG image
        city:
          type: string
          description: city
        country:
          type: string
          description: country
        description:
          type: string
          description: description
        discogs_name:
          type: string
          description: discogs name
        first_name:
          type: string
          description: first name
        followers_count:
          type: integer
          description: number of followers
        followings_count:
          type: integer
          description: number of followed users
        full_name:
          type: string
          description: first and last name
        urn:
          type: string
          description: unique identifier
        kind:
          type: string
          description: kind of resource
        created_at:
          type: string
          description: profile creation datetime
          format: date-time
        last_modified:
          type: string
          description: last modified datetime
          format: date-time
        last_name:
          type: string
          description: last name
        permalink:
          type: string
          description: permalink of the resource
        permalink_url:
          type: string
          description: URL to the SoundCloud.com page
        plan:
          type: string
          description: subscription plan of the user
        playlist_count:
          type: integer
          description: number of public playlists
        public_favorites_count:
          type: integer
          description: number of favorited public tracks
        reposts_count:
          type: integer
          description: number of reposts from user
        track_count:
          type: integer
          description: number of public tracks
        uri:
          type: string
          description: API resource URL
        username:
          type: string
          description: username
        website:
          type: string
          description: a URL to the website
        website_title:
          type: string
          description: a custom title for the website
        station_urn:
          type: string
          description: |
            URN of the user's artist station system playlist, when available. Uses the `system-playlists` collection (e.g. `soundcloud:system-playlists:artist-stations:{id}`). Omitted or null when the user has no public tracks or no station.
          nullable: true
        subscriptions:
          type: array
          description: a list subscriptions associated with the user
          deprecated: true
          items:
            $ref: "#/components/schemas/UserSubscriptions"
      description: SoundCloud User object
      nullable: true
    SystemPlaylist:
      type: object
      properties:
        kind:
          type: string
          description: Type of object (system-playlist).
        urn:
          type: string
          description: System playlist URN.
        title:
          type: string
          description: Playlist title.
        description:
          type: string
          description: Playlist description.
        playlist_type:
          type: string
          description: Playlist type.
        permalink:
          type: string
          description: System playlist permalink slug.
        permalink_url:
          type: string
          description: Permalink URL on soundcloud.com.
        last_updated:
          type: string
          description: Last updated timestamp.
          nullable: true
        tracking_feature_name:
          type: string
          description: Tracking feature name.
          nullable: true
        track_count:
          type: integer
          description: Number of visible tracks in the playlist.
        query_urn:
          type: string
          description: "Query URN used to generate the playlist, when available."
          nullable: true
        tracks:
          type: array
          description: Visible tracks in the playlist.
          items:
            $ref: "#/components/schemas/Track"
      description: "SoundCloud system playlist object (e.g. track station, artist\
        \ station)."
    StorefrontUpdateRequest:
      required:
      - link
      - title
      - type
      type: object
      properties:
        title:
          maxLength: 100
          type: string
          description: Card title shown on the storefront module.
          example: Download now
        type:
          type: string
          description: The type of item offered.
          enum:
          - digital
          - vinyl
          - cd
          - cassette
          - apparel
          - sample_pack
          - subscription
          - live_event
          - live_stream
          - other
        link:
          maxLength: 255
          type: string
          description: External http(s) URL the storefront button opens.
          example: https://example.com/my-track
        link_title:
          maxLength: 50
          type: string
          description: Label of the storefront button. Omit to clear.
          example: Download
        description:
          maxLength: 500
          type: string
          description: Description shown on the storefront module. Omit to clear.
          example: Get the track original files for free.
        price:
          maxLength: 20
          type: string
          description: Display-only price text shown next to the item type. No payment
            is processed by SoundCloud. Omit to clear.
          example: "0"
      description: |
        Creates or updates the storefront (Artist Storefront / buy module) of a track. The request
        replaces the whole storefront - omitted optional fields are cleared, so always send every
        value the storefront should keep.
    ErrorErrors:
      type: object
      properties:
        error_message:
          type: string
    TracksBody1:
      allOf:
      - $ref: "#/components/schemas/TrackDataRequest"
      - required:
        - "track[asset_data]"
        - "track[title]"
    SlashPlaylists:
      allOf:
      - $ref: "#/components/schemas/CreateUpdatePlaylistFormRequest"
      - required:
        - "playlist[title]"
    CreateUpdatePlaylistRequestPlaylist:
      type: object
      properties:
        title:
          type: string
          description: Title of the playlist
        description:
          type: string
          description: Description of the playlist
        sharing:
          type: string
          description: public or private
          enum:
          - public
          - private
        tracks:
          type: array
          description: List of tracks to add to playlist
          items:
            $ref: "#/components/schemas/CreateUpdatePlaylistRequestPlaylistTracks"
        artwork_data:
          title: Only for POST
          type: string
          format: binary
        ean:
          type: string
          description: The European Article Number
        genre:
          type: string
          description: Playlist's genre
        label_name:
          type: string
          description: Label name
        license:
          type: string
          description: License number
        permalink:
          type: string
          description: Playlist's permalink
        permalink_url:
          type: string
          description: Full permalink URL
        purchase_title:
          type: string
          description: Purchase title
        purchase_url:
          type: string
          description: Purchase URL
        release:
          type: string
          description: Playlist's release
        release_date:
          type: string
          description: Release date
        set_type:
          type: string
          description: Playlist or album type
          enum:
          - album
          - playlist
        tag_list:
          type: string
          description: A comma-separated list of tags
    Users:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_href:
          type: string
    TracksResult:
      description: "Tracks returned either as a paginated collection or as a plain\
        \ list, depending on the linked_partitioning query parameter."
      oneOf:
      - $ref: "#/components/schemas/Tracks"
      - $ref: "#/components/schemas/TracksList"
    PlaylistsBody:
      allOf:
      - $ref: "#/components/schemas/CreateUpdatePlaylistFormRequest"
      - required:
        - "playlist[title]"
    SlashTracks:
      allOf:
      - $ref: "#/components/schemas/TrackDataRequest"
      - required:
        - "track[asset_data]"
        - "track[title]"
    Playlist:
      type: object
      properties:
        title:
          type: string
          description: Playlist title.
        urn:
          type: string
          description: Playlist identifier.
        kind:
          type: string
          description: Type of Soundcloud object (playlist).
        artwork_url:
          type: string
          description: URL to a JPEG image.
        created_at:
          type: string
          description: Created timestamp.
        description:
          type: string
          description: Playlist description.
        downloadable:
          type: boolean
          description: is downloadable.
        duration:
          type: integer
          description: Playlist duration.
        ean:
          type: string
          description: European Article Number.
        embeddable_by:
          type: string
          description: Embeddable by.
        genre:
          type: string
          description: Playlist genre.
        label_id:
          type: integer
          description: Label user identifier.
        label_name:
          type: string
          description: Label name.
        last_modified:
          type: string
          description: Last modified timestamp.
        license:
          type: string
          description: License.
        permalink:
          type: string
          description: Playlist permalink.
        permalink_url:
          type: string
          description: Playlist permalink URL.
        playlist_type:
          type: string
          description: Type of playlist.
        purchase_title:
          type: string
          description: Purchase title.
        purchase_url:
          type: string
          description: Purchase URL.
        release:
          type: string
          description: Release.
        release_day:
          type: integer
          description: Day of release.
        release_month:
          type: integer
          description: Month of release.
        release_year:
          type: integer
          description: Year of release.
        sharing:
          type: string
          description: Type of sharing (private/public).
        streamable:
          type: boolean
          description: Is streamable.
        tag_list:
          type: string
          description: Tags.
        track_count:
          type: integer
          description: Count of tracks.
        tracks:
          type: array
          description: List of tracks.
          items:
            $ref: "#/components/schemas/Track"
        type:
          type: string
          description: Playlist type.
        uri:
          type: string
          description: Playlist URI.
        user:
          description: User who created the playlist.
          allOf:
          - $ref: "#/components/schemas/User"
        user_urn:
          type: string
          description: User identifier.
        likes_count:
          type: integer
          description: Count of playlist likes.
        label:
          description: User who owns the record label of the playlist.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/User"
        tracks_uri:
          type: string
          description: tracks URI.
          nullable: true
        tags:
          type: string
          description: Tags.
          nullable: true
      description: Soundcloud Playlist Object
    TracksBody:
      allOf:
      - $ref: "#/components/schemas/TrackDataRequest"
      - required:
        - "track[asset_data]"
        - "track[title]"
    TrackUrnCommentsBody:
      type: object
      properties:
        comment:
          $ref: "#/components/schemas/TrackstrackUrncommentsComment"
    PlaylistsArray:
      type: array
      deprecated: true
      items:
        $ref: "#/components/schemas/Playlist"
    SystemPlaylistsResult:
      description: "System playlists returned either as a paginated collection or\
        \ as a plain list, depending on the linked_partitioning query parameter."
      oneOf:
      - $ref: "#/components/schemas/SystemPlaylists"
      - $ref: "#/components/schemas/SystemPlaylistsArray"
    ActivitiesCollection:
      required:
      - created_at
      - origin
      - type
      type: object
      properties:
        type:
          type: string
          description: |
            Type of activity (e.g. `track`, `track:repost`, `playlist`, `playlist:repost`).
            For `track:repost` and `playlist:repost`, the API also returns a top-level string field
            `reposter` with the URN of the user who reposted.
        created_at:
          type: string
          description: Created timestamp.
        origin:
          description: Origin (track or playlist).
          anyOf:
          - $ref: "#/components/schemas/Track"
          - $ref: "#/components/schemas/Playlist"
    WebProfilesInner:
      type: object
      properties:
        created_at:
          type: string
          description: Timestamp of when the link was added to the profile.
        urn:
          type: string
          description: Id
        kind:
          type: string
          description: Kind
        service:
          type: string
          description: Service or platform
        title:
          type: string
          description: Link's title
        url:
          type: string
          description: URL of the external link
        username:
          type: string
          description: Username extracted from the external link
    CreateUpdatePlaylistFormRequest:
      type: object
      properties:
        playlist[title]:
          type: string
        playlist[sharing]:
          type: string
          enum:
          - public
          - private
          default: public
        playlist[description]:
          type: string
        playlist[tracks][][urn]:
          type: string
          description: "To pass multiple tracks, pass multiple comma-separated values,\
            \ e.g. -F \"playlist[tracks][][urn]=soundcloud:tracks:111,soundcloud:tracks:222\""
        playlist[artwork_data]:
          title: "The playlist artwork in binary format. Supported formats are gif,\
            \ jpeg and png"
          type: string
          format: binary
        playlist[ean]:
          type: string
        playlist[genre]:
          type: string
        playlist[label_name]:
          type: string
        playlist[license]:
          type: string
        playlist[permalink]:
          type: string
        playlist[permalink_url]:
          type: string
        playlist[purchase_title]:
          type: string
        playlist[purchase_url]:
          type: string
        playlist[release]:
          type: string
        playlist[release_date]:
          type: string
        playlist[set_type]:
          type: string
          enum:
          - album
          - playlist
        playlist[tag_list]:
          type: string
    TracksList:
      type: array
      deprecated: true
      items:
        $ref: "#/components/schemas/Track"
    SystemPlaylists:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: "#/components/schemas/SystemPlaylist"
        next_href:
          type: string
    CreateUpdatePlaylistRequestPlaylistTracks:
      required:
      - urn
      type: object
      properties:
        urn:
          type: string
          description: SoundCloud track urn
    UserSubscriptions:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/UserProduct"
